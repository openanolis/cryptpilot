name: Build Docker Images

on:
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'master'
      - 'main'

jobs:
  build-and-push:
    name: Build cryptpilot-${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: fde
            dockerfile: Dockerfile.fde
            target: release-fde
            description: Full-disk encryption tooling for system volumes
            test: cryptpilot-fde-host --version
          - suffix: crypt
            dockerfile: Dockerfile.crypt
            target: release-crypt
            description: Data volume encryption tooling
            test: cryptpilot-crypt --version
          - suffix: verity
            dockerfile: Dockerfile.verity
            target: release-verity
            description: Integrity measurement tool for directory trees
            test: cryptpilot-verity --version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker Setup Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:master,network=host

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cryptpilot-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=cryptpilot-${{ matrix.suffix }}
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Each parallel job builds one image. The Dockerfiles pass --without
      # flags to rpmbuild so each job compiles only the crate(s) its image
      # packages; the three jobs do not duplicate each other's cargo work.
      - name: Build cryptpilot-${{ matrix.suffix }}
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          tags: cryptpilot-${{ matrix.suffix }}:test
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/cryptpilot-${{ matrix.suffix }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load and test image
        run: |
          docker load --input ${{ runner.temp }}/cryptpilot-${{ matrix.suffix }}.tar
          docker run --rm cryptpilot-${{ matrix.suffix }}:test ${{ matrix.test }}

      # Push images (only on tag or master/main branch)
      - name: Login to GHCR Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -e
          set -x
          for tag in ${IMAGE_TAGS}; do
              docker tag cryptpilot-${{ matrix.suffix }}:test ${tag}
              docker push ${tag}
          done
