name: Kernel dm-integrity repro
on:
  push:
    branches: [diag/kernel-repro]
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-latest
    container:
      image: registry.openanolis.cn/openanolis/anolisos:23
      volumes:
        - /run/udev/control:/run/udev/control
        - /dev:/dev
      options: --privileged --ipc=host
    steps:
      - name: Env info
        run: uname -r; cat /proc/version
      - name: LUKS2-integrity journal + ext4 mount (the failing test path)
        run: |
          set -x
          yum install -y device-mapper e2fsprogs util-linux kmod cryptsetup procps-ng >/dev/null 2>&1
          command -v dmesg cryptsetup losetup dmsetup mkfs.ext4 mount
          truncate -s 1G /repro.img
          DEV=$(losetup --find --show /repro.img)
          echo "loop=$DEV kernel=$(uname -r)"
          cryptsetup luksFormat --type luks2 --integrity hmac-sha256 --batch-mode $DEV
          cryptsetup open $DEV reproj
          mkfs.ext4 -F /dev/mapper/reproj || echo "MKFS_JOURNAL_RC=$?"
          mkdir -p /mnt/reproj
          mount -t ext4 /dev/mapper/reproj /mnt/reproj || { echo "MOUNT_JOURNAL_RC=$?"; dmesg 2>/dev/null | tail -10; }
          touch /mnt/reproj/x && df -h /mnt/reproj && echo JOURNAL_MOUNT_OK
          umount /mnt/reproj || true
          cryptsetup close reproj || true
          losetup -d $DEV || true
      - name: LUKS2-integrity no-journal + ext4 mount (EIO discriminator)
        run: |
          set -x
          truncate -s 1G /repro2.img
          DEV=$(losetup --find --show /repro2.img)
          cryptsetup luksFormat --type luks2 --integrity hmac-sha256 --integrity-no-journal --batch-mode $DEV
          cryptsetup open $DEV repro2
          mkfs.ext4 -F /dev/mapper/repro2 || echo "MKFS_NOJOURNAL_RC=$?"
          mkdir -p /mnt/repro2
          mount -t ext4 /dev/mapper/repro2 /mnt/repro2 || { echo "MOUNT_NOJOURNAL_RC=$?"; dmesg 2>/dev/null | tail -10; }
          touch /mnt/repro2/x && df -h /mnt/repro2 && echo NOJOURNAL_MOUNT_OK
          umount /mnt/repro2 || true
          cryptsetup close repro2 || true
          losetup -d $DEV || true
